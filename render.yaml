services:
  - type: web
    name: trading-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1 --log-level info
    envVars:
      # ========== TRADING MODE ==========
      - key: TRADING_MODE
        value: paper
      
      # ========== OANDA SETTINGS ==========
      - key: OANDA_TRADING_MODE
        value: demo
      - key: OANDA_API_KEY
        sync: false
      - key: OANDA_ACCOUNT_ID
        sync: false
      
      # ========== SECURITY ==========
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      
      # ========== TELEGRAM (OPTIONAL) ==========
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      
      # ========== AUTONOMOUS STRATEGY SETTINGS ==========
      # Enable/disable autonomous trading (true/false)
      - key: STRATEGY_ENABLED
        value: "true"
      
      # Strategy type: ema_crossover, rsi, macd, multi_timeframe
      - key: STRATEGY_TYPE
        value: "ema_crossover"
      
      # How often to check for signals (in minutes)
      - key: STRATEGY_TIMEFRAME
        value: "5"
      
      # EMA periods for crossover strategy
      - key: FAST_EMA_PERIOD
        value: "9"
      - key: SLOW_EMA_PERIOD
        value: "21"
      
      # RSI settings
      - key: RSI_PERIOD
        value: "14"
      - key: RSI_OVERSOLD
        value: "30"
      - key: RSI_OVERBOUGHT
        value: "70"